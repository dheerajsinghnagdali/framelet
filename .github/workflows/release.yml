name: Release

on:
  push:
    branches: ['release/v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release branch version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH_NAME#release/}"
          case "$VERSION" in
            v[0-9]*) ;;
            *)
              echo "::error::Release branches must be named release/v<semver>, got $BRANCH_NAME" >&2
              exit 1
              ;;
          esac
          case "$VERSION" in
            *[!a-z0-9.-]*|*..*|*--*|*-.*|*.-*|-*|.*|*-|*.)
              echo "::error::Invalid release branch name: $BRANCH_NAME" >&2
              exit 1
              ;;
          esac
          node scripts/release-tag.mjs "$VERSION" > /dev/null 2>&1 || {
            echo "::error::Invalid release branch name: $BRANCH_NAME" >&2
            exit 1
          }
          VERSION="${VERSION#v}"
          for manifest in packages/*/package.json; do
            PACKAGE_VERSION=$(node -p "require('./$manifest').version")
            if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
              echo "::error::$manifest declares $PACKAGE_VERSION but branch $BRANCH_NAME expects $VERSION" >&2
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build
      - name: Resolve release metadata
        id: release
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          DIST_TAG=$(node scripts/release-tag.mjs "${BRANCH_NAME#release/}")
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --access public --provenance --tag "$DIST_TAG" --registry https://registry.npmjs.org
      - name: Publish to GitHub Packages
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf 'registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          npm publish --workspaces --tag "$DIST_TAG" --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/npmrc-github"
