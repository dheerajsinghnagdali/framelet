name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          for manifest in packages/*/package.json; do
            PACKAGE_VERSION=$(node -p "require('./$manifest').version")
            if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$manifest declares $PACKAGE_VERSION but tag $REF_NAME expects $TAG_VERSION" >&2
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build
      - name: Resolve release metadata
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          DIST_TAG=$(node scripts/release-tag.mjs "$REF_NAME")
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          if [ "$DIST_TAG" = "latest" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --access public --provenance --tag "$DIST_TAG" --registry https://registry.npmjs.org
      - name: Publish to GitHub Packages
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf 'registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          npm publish --workspaces --tag "$DIST_TAG" --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/npmrc-github"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes --prerelease
          else
            gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes
          fi
